name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
      - name: Type-check (site and Studio)
        run: pnpm check
      - name: Build site
        run: pnpm build
        env:
          SANITY_READ_TOKEN: ${{ secrets.SANITY_READ_TOKEN }}
      - name: Page weight budget
        run: node web/scripts/budget.mjs
